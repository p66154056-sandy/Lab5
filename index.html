<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>台南市即時環境資訊</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: #fff;
      margin: 20px;
      font-size: 20px;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    /* ✅ 5 欄 */
    .row-info {
      display: grid;
      grid-template-columns: 0.8fr 0.8fr 1fr 1fr 1fr;
      gap: 6px;
    }

    .row-info>div:nth-child(1) {
      text-align: left;
    }

    .row-info>div:nth-child(2) {
      text-align: center;
    }

    .row-info>div:nth-child(3) {
      text-align: center;
    }

    /* THI */
    .row-info>div:nth-child(4) {
      text-align: center;
    }

    /* 天氣 */
    .row-info>div:nth-child(5) {
      text-align: right;
    }

    /* AQI 方框 */
    #aqi {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* THI 方框 */
    #thi {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .info-btn {
      margin-left: 8px;
      color: rgb(71, 134, 235);
      font-size: 16px;
      font-weight: bold;
      cursor: default;
      user-select: none;
    }

    /* ✅ THI 的ⓘ容器：讓 popover 以它為定位基準 */
    .info-wrap {
      position: relative;
      display: inline-block;
    }

    /* 共用 popover 外觀（預設：AQI 仍用 fixed 右上角） */
    .popover {
      display: none;
      background: rgba(145, 137, 137, 0.8);
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      width: 400px;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 9999;
    }

    /* AQI：維持原本右上角顯示 */
    .popover-fixed {
      position: fixed;
      top: 5px;
      right: 20px;
    }

    /* ✅ THI：出現在ⓘ右側，上緣對齊ⓘ */
    .popover-right {
      position: absolute;
      top: -60px;
      left: calc(100% + 8px);
    }

    /* ✅ AQI：原本規則保留（ⓘ旁邊緊鄰 popover） */
    .info-btn:hover+.popover,
    .popover:hover {
      display: block;
    }

    /* ✅ THI：改成 hover info-wrap 顯示（避免與上面規則衝突） */
    .info-wrap:hover .popover {
      display: block;
    }

    .aqi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }

    .aqi-title {
      color: #fff;
      font-size: 16px;
    }

    .aqi-level {
      padding: 6px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      width: 100%;
      box-sizing: border-box;
    }

    /* AQI 色階 */
    .level1 {
      background: rgba(121, 255, 121, 0.75);
      color: #000;
    }

    .level2 {
      background: rgba(255, 255, 111, 0.75);
      color: #000;
    }

    .level3 {
      background: rgba(255, 187, 119, 0.75);
      color: #000;
    }

    .level4 {
      background: rgba(255, 45, 45, 0.75);
      color: #fff;
    }

    .level5 {
      background: rgba(177, 91, 255, 0.75);
      color: #fff;
    }

    .level6 {
      background: rgba(126, 0, 35, 0.75);
      color: #fff;
    }

    /* THI 色階 */
    .thi1 {
      background: rgba(0, 80, 200, 0.75);
      color: #fff;
    }

    /* ≤10 */
    .thi2 {
      background: rgba(0, 150, 255, 0.75);
      color: #fff;
    }

    /* 11–15 */
    .thi3 {
      background: rgba(0, 220, 255, 0.75);
      color: #000;
    }

    /* 16–19 */
    .thi4 {
      background: rgba(0, 200, 80, 0.75);
      color: #000;
    }

    /* 20–26 */
    .thi5 {
      background: rgba(255, 120, 180, 0.75);
      color: #000;
    }

    /* 27–30 */
    .thi6 {
      background: rgba(255, 0, 0, 0.75);
      color: #fff;
    }

    /* ≥31 */
  </style>
</head>

<body>
  <div class="container">

    <!-- 第一排：時間 + 固定測站說明 -->
    <div class="row-top">
      <div id="datetime">--</div>
      <div style="font-size:14px; text-align:right; line-height:1.6;">
        空氣品質：臺南測站｜天氣：臺南氣象站
      </div>
    </div>

    <!-- 第二排：五個資訊 -->
    <div class="row-info">
      <div>🌡 溫度：<span id="temp">載入中…</span></div>
      <div>💧 濕度：<span id="humidity">載入中…</span></div>

      <!-- THI -->
      <div style="position:relative; display:inline-block;">
        😊 THI：<span id="thi">載入中…</span>

        <span class="info-wrap">
          <span class="info-btn">ⓘ</span>
          <div class="popover popover-right">
            <b class="aqi-title">THI 分級說明</b>
            <div class="aqi-grid">
              <div class="aqi-level thi1">≤ 10 非常寒冷</div>
              <div class="aqi-level thi2">11 – 15 寒冷</div>
              <div class="aqi-level thi3">16 – 19 稍寒</div>
              <div class="aqi-level thi4">20 – 26 舒適</div>
              <div class="aqi-level thi5">27 – 30 悶熱</div>
              <div class="aqi-level thi6">≥ 31 易中暑</div>
            </div>
          </div>
        </span>
      </div>

      <div>⛅ 天氣：<span id="weather">載入中…</span></div>

      <!-- AQI -->
      <div style="position:relative; display:inline-block;">
        🌫 AQI：<span id="aqi">載入中…</span>
        <span class="info-btn">ⓘ</span>
        <div class="popover popover-fixed">
          <b class="aqi-title">AQI 分級說明</b>
          <div class="aqi-grid">
            <div class="aqi-level level1">0-50 良好</div>
            <div class="aqi-level level2">51-100 普通</div>
            <div class="aqi-level level3">101-150 對敏感族群不健康</div>
            <div class="aqi-level level4">151-200 對所有人不健康</div>
            <div class="aqi-level level5">201-300 非常不健康</div>
            <div class="aqi-level level6">301+ 危害</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 時間
    function updateTime() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      const formatted = now.toLocaleDateString() + " (週" + weekdays[now.getDay()] + ") " + now.toLocaleTimeString();
      document.getElementById("datetime").innerText = formatted;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // AQI 顏色
    function getAQIColor(aqi) {
      if (aqi <= 50) return "#79FF79";
      if (aqi <= 100) return "#FFFF6F";
      if (aqi <= 150) return "#FFBB77";
      if (aqi <= 200) return "#FF2D2D";
      if (aqi <= 300) return "#B15BFF";
      return "#7E0023";
    }

    // THI 分級
    function getTHILevel(thi) {
      if (thi <= 10) return { label: "非常寒冷", cls: "thi1" };
      if (thi <= 15) return { label: "寒冷", cls: "thi2" };
      if (thi <= 19) return { label: "稍寒", cls: "thi3" };
      if (thi <= 26) return { label: "舒適", cls: "thi4" };
      if (thi <= 30) return { label: "悶熱", cls: "thi5" };
      return { label: "易中暑", cls: "thi6" };
    }

    // ✅ 修正：RH 要用 0~1（RH/100），不然 Td/THI 會爆表
    // Td = (RH/100)^(1/8) (112 + 0.9T) + 0.1T − 112
    function calcTd(T, RH_percent) {
      const RH = RH_percent / 100;
      return Math.pow(RH, 1 / 8) * (112 + 0.9 * T) + 0.1 * T - 112;
    }

    // THI = T − 0.55[1 − exp(17.269Td/(Td+237.3))/exp(17.269T/(T+237.3))](T−14)
    function calcTHI(T, Td) {
      const a = Math.exp((17.269 * Td) / (Td + 237.3));
      const b = Math.exp((17.269 * T) / (T + 237.3));
      return T - 0.55 * (1 - a / b) * (T - 14);
    }

    let latestTemp = null;
    let latestHum = null;

    function updateTHIBox() {
      const thiBox = document.getElementById("thi");
      if (!thiBox) return;

      if (!Number.isFinite(latestTemp) || !Number.isFinite(latestHum) || latestHum <= 0) {
        thiBox.innerText = "載入中…";
        thiBox.className = "";
        thiBox.style.backgroundColor = "transparent";
        return;
      }

      const Td = calcTd(latestTemp, latestHum);
      const thi = calcTHI(latestTemp, Td);

      const thiRounded = Math.round(thi * 10) / 10;
      const lv = getTHILevel(thiRounded);

      thiBox.innerText = `${thiRounded} (${lv.label})`;

      // 清掉 inline 背景，避免蓋掉 class 背景
      thiBox.style.backgroundColor = "";

      thiBox.className = "";
      thiBox.classList.add(lv.cls);
    }

    // ✅✅✅ 改：測站 mapping（溫濕度改用 CWA stationId）
    const stationMap = {
      "臺南": { aqi: "臺南", cwaId: "467410", weatherId: "467420" }, // ← 原本 467410 改成 C0O900
      "安南區": { aqi: "安南", cwaId: "C2O950", weatherId: "CAN040" },
      "新營區": { aqi: "新營", cwaId: "C0X250", weatherId: "CAN010" },
      "善化區": { aqi: "善化", cwaId: "C0O900", weatherId: "CAN090" }
    };

    // ✅✅✅ 改：用 CWA O-A0001-001 抓溫濕度（一次抓完）
    // 前端只呼叫 Render 後端；API 金鑰請只存放在 Render Environment Variables。
    const API_BASE_URL = "https://tainan-env-api.onrender.com";
    const CWA_API = `${API_BASE_URL}/api/cwa`;

    let cwaCache = { ts: 0, byId: new Map() };
    const CWA_CACHE_MS = 60 * 1000; // 1分鐘更新一次

    async function fetchCWAAllStations() {
      const now = Date.now();
      if (cwaCache.byId.size > 0 && now - cwaCache.ts < CWA_CACHE_MS) {
        return cwaCache.byId;
      }

      const res = await fetch(CWA_API, { cache: "no-store" });
      const json = await res.json();

      // ✅ 兼容：records.location（常見）或 records.Station（你之前成功那種）
      const list =
        (Array.isArray(json?.records?.location) && json.records.location) ||
        (Array.isArray(json?.records?.Station) && json.records.Station) ||
        [];

      const map = new Map();
      for (const item of list) {
        const id = item?.StationId ?? item?.stationId ?? item?.stationID ?? item?.StationID;
        if (!id) continue;
        map.set(String(id).trim(), item);
      }

      cwaCache = { ts: now, byId: map };
      return map;
    }

    function findCwaStation(byIdMap, stationKey) {
      const key = String(stationKey).trim();

      // 1) 先用 StationId 直接找
      if (byIdMap.has(key)) return byIdMap.get(key);

      // 2) 找不到就用站名（StationName）模糊比對
      for (const v of byIdMap.values()) {
        const name = String(v?.StationName ?? v?.stationName ?? "").trim();
        if (name && (name === key || name.includes(key) || key.includes(name))) return v;
      }
      return null;
    }


    function getElementValue(weatherElementArray, elementName) {
      const el = (weatherElementArray || []).find(e =>
        (e.elementName || e.ElementName || "").toUpperCase() === elementName.toUpperCase()
      );
      const v = el?.elementValue ?? el?.ElementValue;
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : null;
    }

    // ✅ 從 CWA payload 找到指定 StationId 的那筆 location
    function findCwaLocationById(payload, stationId) {
      // ✅ 你的 JSON 是 records.Station（陣列）
      const list =
        payload?.records?.Station ||
        payload?.records?.station ||
        payload?.records?.location ||
        payload?.records?.Location ||
        [];

      if (!Array.isArray(list)) return null;

      const sid = String(stationId).trim();
      return list.find(x => String(x.StationId).trim() === sid) || null;
    }


    function readElement(st, keyUpper) {
      const we = st?.WeatherElement;

      // ✅ 型態 1：WeatherElement 是物件（AirTemperature / RelativeHumidity）
      if (we && typeof we === "object" && !Array.isArray(we)) {
        if (keyUpper === "AIRTEMPERATURE") return parseFloat(we.AirTemperature);
        if (keyUpper === "RELATIVEHUMIDITY") return parseFloat(we.RelativeHumidity);
      }

      // ✅ 型態 2：WeatherElement 是陣列（[{elementName, elementValue}, ...]）
      if (Array.isArray(we)) {
        const hit = we.find(e => String(e.elementName || e.ElementName || "").toUpperCase() === keyUpper);
        const v = hit?.elementValue ?? hit?.ElementValue;
        return parseFloat(v);
      }

      return NaN;
    }

    // ✅ 溫度（CWA）
    async function loadTemp(station) {
      const stationKey = stationMap[station].cwaId; // 可以放 StationId（C0X250）或站名（臺南/新營）
      try {
        const byIdMap = await fetchCWAAllStations();
        const st = findCwaStation(byIdMap, stationKey);
        if (!st) throw new Error(`CWA 找不到 stationKey=${stationKey}`);

        const t = readElement(st, "AIRTEMPERATURE");
        if (!Number.isFinite(t) || t === -99) throw new Error(`CWA 溫度無效：${t}`);

        document.getElementById("temp").innerText = `${t.toFixed(1)} °C`;
        latestTemp = t;
      } catch (e) {
        console.error("[CWA][TEMP] load failed:", e);
        document.getElementById("temp").innerText = "⚠ 讀取失敗";
        latestTemp = null;
      } finally {
        updateTHIBox();
      }
    }

    // ✅ 濕度（CWA）
    async function loadHumidity(station) {
      const stationKey = stationMap[station].cwaId;
      try {
        const byIdMap = await fetchCWAAllStations();
        const st = findCwaStation(byIdMap, stationKey);
        if (!st) throw new Error(`CWA 找不到 stationKey=${stationKey}`);

        const h = readElement(st, "RELATIVEHUMIDITY");
        if (!Number.isFinite(h) || h === -99) throw new Error(`CWA 濕度無效：${h}`);

        document.getElementById("humidity").innerText = `${h.toFixed(0)} %`;
        latestHum = h;
      } catch (e) {
        console.error("[CWA][HUM] load failed:", e);
        document.getElementById("humidity").innerText = "⚠ 讀取失敗";
        latestHum = null;
      } finally {
        updateTHIBox();
      }
    }


    // 天氣固定使用臺南氣象站（467410），資料仍由 Render 後端 /api/cwa 取得。
    async function loadWeather() {
      const el = document.getElementById("weather");
      try {
        const res = await fetch(CWA_API, { cache: "no-store" });
        if (!res.ok) throw new Error(`CWA HTTP ${res.status}`);
        const payload = await res.json();
        const list = payload?.records?.Station || payload?.records?.station ||
                     payload?.records?.location || payload?.records?.Location || [];
        if (!Array.isArray(list) || list.length === 0) throw new Error("後端沒有回傳氣象測站資料");

        // 優先以臺南站站號查找；若資料版本站號不同，再以站名查找。
        const st = list.find(x => String(x?.StationId ?? x?.stationId ?? x?.StationID ?? "").trim() === "467410") ||
                   list.find(x => String(x?.StationName ?? x?.stationName ?? "").trim().includes("臺南"));
        if (!st) throw new Error("找不到臺南氣象站（467410）");

        const we = st.WeatherElement ?? st.weatherElement ?? {};
        const weather = String(we.Weather ?? we.weather ?? "").trim();
        if (!weather || weather === "-99") throw new Error("臺南氣象站目前沒有有效天氣描述");
        const now = we.Now ?? we.now ?? {};
        const rain = now.Precipitation ?? now.precipitation;
        const rainText = rain !== undefined && rain !== null && String(rain).trim() !== "" && String(rain) !== "-99"
          ? `｜降雨 ${rain}` : "";
        el.innerText = `${weather}${rainText}`;
      } catch (e) {
        console.error("[CWA][WEATHER] load failed:", e);
        if (el) el.innerText = "⚠ 讀取失敗";
      }
    }

    // 空氣品質固定使用「臺南」測站，資料由 Render 後端 /api/aqi 取得。
    async function loadAQI() {
      const aqiBox = document.getElementById("aqi");
      aqiBox.innerText = "載入中…";
      aqiBox.style.backgroundColor = "transparent";
      try {
        const res = await fetch(`${API_BASE_URL}/api/aqi`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const records = Array.isArray(data) ? data :
          (data.records ?? data.result?.records ?? data.data?.records ?? data.result ?? data.data);
        if (!Array.isArray(records)) throw new Error("後端回傳的空品資料格式不符");

        const record = records.find(r => String(r?.sitename ?? r?.SiteName ?? r?.station_name ?? "").trim() === "臺南") ||
          records.find(r => String(r?.sitename ?? r?.SiteName ?? r?.station_name ?? "").trim().includes("臺南"));
        if (!record) throw new Error("空品資料中找不到臺南測站");
        const aqi = Number(record.aqi ?? record.AQI);
        if (!Number.isFinite(aqi)) throw new Error("臺南測站 AQI 不是有效數字");
        const status = record.status ?? record.Status ?? "";
        aqiBox.innerText = `${aqi}${status ? `（${status}）` : ""}`;
        aqiBox.style.backgroundColor = getAQIColor(aqi);
      } catch (e) {
        console.error("[AQI] 讀取失敗：", e);
        aqiBox.innerText = "⚠ 讀取失敗";
      }
    }

    // 溫度、濕度、THI、天氣與空品都固定使用臺南站，不再顯示下拉選單。
    function updateAll() {
      latestTemp = null;
      latestHum = null;
      updateTHIBox();
      loadTemp("臺南");
      loadHumidity("臺南");
      loadWeather();
      loadAQI();
    }

    updateAll();
    setInterval(() => {
      updateAll();
      console.log("⏳ 已更新臺南測站資料");
    }, 300000);

  </script>
</body>

</html>
